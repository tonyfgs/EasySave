services:
  console:
    image: console
    build:
      context: .
      dockerfile: Console/Dockerfile

  log-centralizer:
    image: log-centralizer
    build:
      context: .
      dockerfile: LogCentralizer/Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - log-data:/app/logs
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LogDirectory=/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  log-data:

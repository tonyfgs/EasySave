name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ runner.os == 'Windows' && 'EasySave.sln' || 'EasySave.NoGUI.slnf' }} --locked-mode || dotnet restore ${{ runner.os == 'Windows' && 'EasySave.sln' || 'EasySave.NoGUI.slnf' }}

      - name: Build
        run: dotnet build ${{ runner.os == 'Windows' && 'EasySave.sln' || 'EasySave.NoGUI.slnf' }} ${{ runner.os != 'Windows' && '--no-restore' || '' }} --configuration Release /p:TreatWarningsAsErrors=true

      - name: Test
        run: >
          dotnet test ${{ runner.os == 'Windows' && 'EasySave.sln' || 'EasySave.NoGUI.slnf' }} --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/test-results.trx"
          retention-days: 14

      - name: Install ReportGenerator
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        if: matrix.os == 'ubuntu-latest'
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:./CoverageReport
          -reporttypes:"Cobertura"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./CoverageReport
          retention-days: 30

      - name: Generate coverage summary
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: CoverageReport/Cobertura.xml
          badge: true
          format: markdown
          output: both
          thresholds: "60 80"

      - name: Add coverage comment to PR
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          recreate: true
          path: code-coverage-results.md

  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore EasySave.NoGUI.slnf

      - name: Check formatting
        run: dotnet format EasySave.NoGUI.slnf --verify-no-changes --verbosity diagnostic

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore EasySave.NoGUI.slnf

      - name: Check for vulnerable packages
        run: dotnet list EasySave.NoGUI.slnf package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt; if grep -q "has the following vulnerable packages" vulnerability-report.txt; then exit 1; fi

      - name: Check for deprecated packages
        run: dotnet list EasySave.NoGUI.slnf package --deprecated 2>&1 | tee deprecated-report.txt; if grep -q "has the following deprecated packages" deprecated-report.txt; then echo "::warning::Deprecated packages found"; fi

      - name: Check for outdated packages
        if: github.event_name == 'pull_request'
        run: dotnet list EasySave.NoGUI.slnf package --outdated
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets in commit history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate solution structure
        run: dotnet sln EasySave.sln list

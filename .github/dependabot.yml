version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    groups:
      xunit:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      coverlet:
        patterns:
          - "coverlet*"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10
    reviewers:
      - tonyfgs
    labels:
      - dependencies
      - nuget

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5
    reviewers:
      - tonyfgs
    labels:
      - dependencies
      - ci-cd

  - package-ecosystem: docker
    directory: /Console
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 3
    reviewers:
      - tonyfgs
    labels:
      - dependencies
      - docker
